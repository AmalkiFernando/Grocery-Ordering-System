<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Order Confirmed</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">
</head>
<body class="section">
<div class="container has-text-centered">
    <h1 class="title">Thank you! Your order is confirmed.</h1>
    <p class="subtitle">Order <span th:text="${order.orderNumber}"></span> has been placed successfully.</p>
    <a class="button is-primary" th:href="@{/customer}">Back to Products</a>
</div>
</body>
</html>
