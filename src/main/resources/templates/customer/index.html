<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Customer Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">
    <style>
        :root {
            --bg-1: #ecfdf5;  /* emerald-50 */
            --bg-2: #d1fae5;  /* emerald-100 */
            --bg-3: #e0f2fe;  /* sky-100 */
            --text-strong: #052e16; /* emerald-950 */
            --text-soft: #1f2937;   /* gray-800 */
            --accent-1: #059669;    /* emerald-600 */
            --accent-2: #10b981;    /* emerald-500 */
        }
        body { min-height:100vh; background: linear-gradient(120deg, var(--bg-1), var(--bg-2), var(--bg-3)); background-size:300% 300%; animation: bg 20s ease infinite; }
        @keyframes bg { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        .hero-banner { background: linear-gradient(135deg, rgba(5,150,105,.12), rgba(16,185,129,.08)); border: 1px solid rgba(16,185,129,.2); border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(2,6,23,.08); }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
        .card { border: 1px solid rgba(16,185,129,.18); border-radius: 14px; box-shadow: 0 10px 22px rgba(2,6,23,.08); overflow: hidden; }
        .card .media { align-items: center; }
        .price { color: var(--accent-1); font-weight: 700; }
        .stock { color: #475569; font-size: .9rem; }
        .button.is-accent { background-image: linear-gradient(135deg,var(--accent-1),var(--accent-2)); color:#fff; border:none; }
        .searchbar { display:flex; gap:10px; margin: 14px 0 18px; }
        .searchbar input { border-color: #c7f0df; }
        .searchbar input:focus { border-color: var(--accent-2); box-shadow: 0 0 0 0.125em rgba(16,185,129,.25); }
        .thumb { width:100%; height:140px; object-fit:cover; background:#f8fafc; }
        .thumb.loading { background: repeating-linear-gradient(45deg,#f1f5f9,#f1f5f9 10px,#e2e8f0 10px,#e2e8f0 20px); }
    </style>
</head>
<body class="section">
<div class="container">
    <div class="is-flex is-justify-content-flex-end mb-3">
        <form method="post" action="/logout">
            <button class="button is-light" type="submit">Log out</button>
        </form>
    </div>
    <div class="hero-banner mb-5">
        <h1 class="title is-4" style="color:var(--text-strong)">Shop Fresh Groceries</h1>
        <p class="subtitle is-6" style="color:var(--text-soft)">Explore items added by admin, browse and plan your basket.</p>
        <div class="searchbar">
            <input class="input" id="search" type="text" placeholder="Search products...">
            <button class="button is-accent" onclick="filterProducts()">Search</button>
        </div>
    </div>

    <div id="grid" class="product-grid">
        <div class="card" th:each="p : ${products}" th:attr="data-name=${p.name}">
            <div class="card-image">
                <figure class="image is-4by3">
                    <img class="thumb loading" th:src="${p.imageUrl} != null ? ${p.imageUrl} : @{'https://source.unsplash.com/400x300/?grocery,' + ${p.name}}" th:alt="${p.name}">
                </figure>
            </div>
            <div class="card-content">
                <p class="title is-6" th:text="${p.name}"></p>
                <p class="price" th:text="'Rs. ' + ${p.price}"></p>
                <p class="stock" th:text="${p.quantityInStock} + ' in stock'"></p>
            </div>
            <div class="card-footer">
                <form th:action="@{'/cart/add/' + ${p.id}}" method="post" class="card-footer-item" style="padding:0">
                    <button class="button is-accent is-light" type="submit" style="width:100%">Add to cart</button>
                </form>
                <a class="card-footer-item button is-accent is-light" th:href="@{/feedback/product/{id}(id=${p.id})}">Reviews</a>
                <a class="card-footer-item button is-accent is-light" th:href="@{/rating/product/{id}(id=${p.id})}">Ratings</a>
            </div>
        </div>
    </div>
</div>

<script>
    function filterProducts(){
        var q = (document.getElementById('search').value || '').toLowerCase();
        var cards = document.querySelectorAll('#grid .card');
        cards.forEach(function(c){
            var name = (c.getAttribute('data-name') || '').toLowerCase();
            c.style.display = name.includes(q) ? '' : 'none';
        });
    }
    document.getElementById('search').addEventListener('input', filterProducts);
    // Progressive, encoded fallbacks for product images: Unsplash -> LoremFlickr -> Picsum
    (function(){
        var imgs = document.querySelectorAll('img.thumb');
        imgs.forEach(function(img){
            var name = img.getAttribute('alt') || '';
            var encoded = encodeURIComponent(name);
            function setLoaded(){ img.classList.remove('loading'); }
            img.addEventListener('load', setLoaded, { once: true });
            var tried = 0;
            img.addEventListener('error', function onErr(){
                tried++;
                if (tried === 1) {
                    img.src = 'https://loremflickr.com/400/300/' + encoded;
                } else if (tried === 2) {
                    img.src = 'https://picsum.photos/seed/' + encoded + '/400/300';
                } else {
                    img.removeEventListener('error', onErr);
                }
            });
            // Ensure initial unsplash URL uses encoded name if template provided a generic grocery query
            if (img.src.indexOf('source.unsplash.com') !== -1) {
                img.src = 'https://source.unsplash.com/400x300/?' + encoded;
            }
        });
    })();
</script>
</body>
</html>
