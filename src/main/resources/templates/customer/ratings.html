<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Product Ratings</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">
    <style>
        :root {
            --bg-1: #ecfdf5;  /* emerald-50 */
            --bg-2: #d1fae5;  /* emerald-100 */
            --bg-3: #e0f2fe;  /* sky-100 */
            --text-strong: #052e16; /* emerald-950 */
            --text-soft: #1f2937;   /* gray-800 */
            --accent-1: #059669;    /* emerald-600 */
            --accent-2: #10b981;    /* emerald-500 */
        }
        body { min-height:100vh; background: linear-gradient(120deg, var(--bg-1), var(--bg-2), var(--bg-3)); background-size:300% 300%; animation: bg 20s ease infinite; }
        @keyframes bg { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        .hero-banner { background: linear-gradient(135deg, rgba(5,150,105,.12), rgba(16,185,129,.08)); border: 1px solid rgba(16,185,129,.2); border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(2,6,23,.08); }
        .rating-card { border: 1px solid rgba(16,185,129,.18); border-radius: 14px; box-shadow: 0 10px 22px rgba(2,6,23,.08); margin-bottom: 16px; }
        .rating-stars { color: #fbbf24; font-size: 1.2rem; }
        .button.is-accent { background-image: linear-gradient(135deg,var(--accent-1),var(--accent-2)); color:#fff; border:none; }
        .average-rating { font-size: 2rem; font-weight: bold; color: var(--accent-1); }
        .rating-summary { background: rgba(255,255,255,0.8); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
        .rating-bar { background: #e5e7eb; border-radius: 4px; height: 8px; margin: 4px 0; }
        .rating-fill { background: #fbbf24; height: 100%; border-radius: 4px; }
    </style>
</head>
<body class="section">
<div class="container">
    <div class="is-flex is-justify-content-space-between mb-3">
        <a href="/customer" class="button is-light">← Back to Products</a>
        <form method="post" action="/logout">
            <button class="button is-light" type="submit">Log out</button>
        </form>
    </div>

    <div class="hero-banner mb-5" th:if="${product}">
        <h1 class="title is-4" style="color:var(--text-strong)" th:text="${product.name}">Product Name</h1>
        <p class="subtitle is-6" style="color:var(--text-soft)">Customer Ratings</p>
    </div>

    <!-- Rating Summary -->
    <div class="rating-summary" th:if="${product}">
        <div class="columns is-vcentered">
            <div class="column is-narrow">
                <div class="average-rating" th:text="${averageRating}">4.5</div>
                <div class="rating-stars">★★★★☆</div>
                <p class="is-size-7" th:text="${ratingCount} + ' ratings'">25 ratings</p>
            </div>
            <div class="column">
                <div class="buttons">
                    <a th:href="@{/rating/submit/{id}(id=${product.id})}" class="button is-accent">Rate Product</a>
                    <a th:href="@{/feedback/product/{id}(id=${product.id})}" class="button is-accent is-light">View Reviews</a>
                </div>
            </div>
        </div>
        
        <!-- Rating Distribution -->
        <div th:if="${ratingDistribution != null and !ratingDistribution.empty}" class="mt-4">
            <h3 class="title is-6">Rating Distribution</h3>
            <div th:each="dist : ${ratingDistribution}">
                <div class="is-flex is-align-items-center mb-2">
                    <span class="is-size-7" style="width: 20px;" th:text="${dist[0]} + '★'">5★</span>
                    <div class="rating-bar" style="flex: 1; margin: 0 8px;">
                        <div class="rating-fill" th:style="'width: ' + ${dist[1] * 100 / ratingCount} + '%'"></div>
                    </div>
                    <span class="is-size-7" th:text="${dist[1]}">5</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Rating List -->
    <div th:if="${ratings != null and !ratings.empty}">
        <h2 class="title is-5 mb-4">Customer Ratings</h2>
        <div th:each="rating : ${ratings}">
            <div class="card rating-card">
                <div class="card-content">
                    <div class="media">
                        <div class="media-content">
                            <p class="title is-6" th:text="${rating.customerName}">Customer Name</p>
                            <p class="subtitle is-7" th:text="${rating.customerEmail}">customer@email.com</p>
                        </div>
                        <div class="media-right">
                            <div class="rating-stars" th:text="${rating.ratingStars}">★★★★☆</div>
                            <p class="is-size-7" th:text="${#temporals.format(rating.createdAt, 'MMM dd, yyyy')}">Jan 15, 2024</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- No ratings message -->
    <div th:if="${ratings == null or ratings.empty}" class="has-text-centered">
        <div class="box">
            <p class="title is-5">No ratings yet</p>
            <p class="subtitle is-6">Be the first to rate this product!</p>
            <a th:href="@{/rating/submit/{id}(id=${product.id})}" class="button is-accent">Rate Product</a>
        </div>
    </div>
</div>
</body>
</html>
