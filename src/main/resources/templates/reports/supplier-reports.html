<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplier Reports - Reporting & Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/supplier">Supplier Dashboard</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" href="/reports/supplier">Reports</a>
                <a class="nav-link" href="/logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h2><i class="fas fa-chart-bar"></i> Supplier Reports</h2>
                <p class="text-muted">Generate and view inventory reports</p>
            </div>
        </div>

        <!-- Generate Reports Section -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-plus-circle"></i> Generate New Report</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/reports/supplier/generate}" method="post">
                            <div class="row">
                                <div class="col-md-4">
                                    <label class="form-label">Report Type</label>
                                    <input type="text" class="form-control" value="Inventory Report" readonly>
                                </div>
                                <div class="col-md-4">
                                    <label for="period" class="form-label">Period</label>
                                    <select class="form-select" id="period" name="period" required>
                                        <option value="">Select Period</option>
                                        <option value="DAILY">Daily</option>
                                        <option value="MONTHLY">Monthly</option>
                                        <option value="YEARLY">Yearly</option>
                                    </select>
                                </div>
                                <div class="col-md-4 d-flex align-items-end">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-chart-line"></i> Generate Report
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Reports Display -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h5><i class="fas fa-boxes"></i> Inventory Reports</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(inventoryReports)}" class="text-muted">
                            No inventory reports generated yet.
                        </div>
                        <div th:each="report : ${inventoryReports}" class="mb-2">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <strong th:text="${report.period}"></strong>
                                    <br>
                                    <small class="text-muted" th:text="${#temporals.format(report.generatedDate, 'yyyy-MM-dd HH:mm')}"></small>
                                </div>
                                <a th:href="@{/reports/view/{id}(id=${report.id})}" class="btn btn-sm btn-outline-primary">
                                    <i class="fas fa-eye"></i> View
                                </a>
                            </div>
                            <hr th:if="${!reportStat.last}">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
