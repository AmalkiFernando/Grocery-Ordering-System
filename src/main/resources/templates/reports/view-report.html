<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${'View Report - ' + report.reportType}">View Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>
            <i class="fas fa-file-alt"></i>
            <span th:text="${report.reportType}">Report</span>
            <small class="text-muted" th:text="${'(' + report.period + ')'}"></small>
        </h2>
        <a class="btn btn-secondary" href="javascript:history.back()">Back</a>
    </div>

    <div class="row g-3">
        <div class="col-md-4">
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-info-circle"></i> Report Info
                </div>
                <div class="card-body">
                    <dl class="row mb-0">
                        <dt class="col-5">Type</dt>
                        <dd class="col-7" th:text="${report.reportType}"></dd>
                        <dt class="col-5">Period</dt>
                        <dd class="col-7" th:text="${report.period}"></dd>
                        <dt class="col-5">Generated</dt>
                        <dd class="col-7" th:text="${#temporals.format(report.generatedDate, 'yyyy-MM-dd HH:mm')}"></dd>
                        <dt class="col-5">Range</dt>
                        <dd class="col-7">
                            <span th:text="${#temporals.format(report.periodStart, 'yyyy-MM-dd')}"></span>
                            -
                            <span th:text="${#temporals.format(report.periodEnd, 'yyyy-MM-dd')}"></span>
                        </dd>
                        <dt class="col-5">By</dt>
                        <dd class="col-7" th:text="${report.generatedBy}"></dd>
                    </dl>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><i class="fas fa-database"></i> Report Data (JSON)</span>
                    <button class="btn btn-sm btn-outline-primary" onclick="prettyPrint()"><i class="fas fa-code"></i> Pretty Print</button>
                </div>
                <div class="card-body">
                    <pre id="json" style="white-space: pre-wrap; word-break: break-word;" th:text="${report.reportData}"></pre>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function prettyPrint() {
  try {
    var el = document.getElementById('json');
    var obj = JSON.parse(el.textContent || el.innerText);
    el.textContent = JSON.stringify(obj, null, 2);
  } catch (e) {
    alert('Data is not valid JSON');
  }
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
