<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Suppliers</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">
    <style>
        table.table thead th {
            position: sticky;
            top: 0;
            background: #0ea5e9;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: .04em;
        }
        table.table tbody tr:hover {
            background-color: rgba(14, 165, 233, 0.08);
        }
        .tag.is-soft {
            background: rgba(14, 165, 233, .12);
            color: #075985;
        }
    </style>
</head>
<body class="section">
<div class="container">
    <div class="is-flex is-justify-content-space-between is-align-items-center">
        <h1 class="title">Suppliers</h1>
        <div class="buttons">
            <form method="post" action="/logout">
                <button class="button is-light" type="submit">Log out</button>
            </form>
            <a class="button" th:href="@{/admin}">Back</a>
        </div>
    </div>
    <div class="tabs is-toggle is-fullwidth">
        <ul>
            <li><a th:href="@{/admin/products}">Products</a></li>
            <li><a th:href="@{/admin/inventory}">Inventory</a></li>
            <li class="is-active"><a>Suppliers</a></li>
        </ul>
    </div>
    <div class="mt-5">
        <div class="is-flex is-justify-content-space-between is-align-items-center mb-4">
            <h2 class="title is-4" style="margin: 0;">Active List</h2>
            <span class="tag is-soft is-medium">Suppliers</span>
        </div>

    <table class="table is-fullwidth is-striped is-hoverable">
        <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Address</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${suppliers}">
            <td><strong th:text="${s.name}"></strong></td>
            <td><span class="tag is-info is-light" th:text="${s.email}"></span></td>
            <td><span class="tag is-link is-light" th:text="${s.phone}"></span></td>
            <td><span class="tag is-soft" th:text="${s.address}"></span></td>
            <td>
                <form th:action="@{'/admin/suppliers/' + ${s.id} + '/delete'}" method="post">
                    <button class="button is-small is-danger" style="background-color: #065f46;"
                            type="submit">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <h2 class="subtitle mt-6">Add Supplier</h2>
    <form method="post" th:object="${newSupplier}">
        <div class="columns is-multiline">
            <div class="column is-12-tablet is-3-desktop"><input class="input" placeholder="Name" th:field="*{name}" required /></div>
            <div class="column is-12-tablet is-3-desktop"><input class="input" placeholder="Email" th:field="*{email}" required /></div>
            <div class="column is-12-tablet is-3-desktop"><input class="input" placeholder="Phone" th:field="*{phone}" /></div>
            <div class="column is-12-tablet is-3-desktop"><input class="input" placeholder="Address" th:field="*{address}" /></div>
            <div class="column is-narrow"><button class="button is-gradient" type="submit">Add Supplier</button></div>
        </div>
    </form>
    </div>

</div>
</body>
</html>
