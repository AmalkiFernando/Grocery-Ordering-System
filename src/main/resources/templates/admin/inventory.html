<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Inventory</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body class="section">
<div class="container">
    <div class="is-flex is-justify-content-space-between is-align-items-center">
        <h1 class="title">Inventory</h1>
        <div class="buttons">
            <form method="post" action="/logout">
                <button class="button is-light" type="submit">Log out</button>
            </form>
            <a class="button" th:href="@{/admin}">Back</a>
        </div>
    </div>

    <div class="tabs is-toggle is-fullwidth">
        <ul>
            <li><a th:href="@{/admin/products}">Products</a></li>
            <li class="is-active"><a>Inventory</a></li>
            <li><a th:href="@{/admin/suppliers}">Suppliers</a></li>
            <li><a th:href="@{/reports/admin}">Reports</a></li>
        </ul>
    </div>

    <h2 class="subtitle">Low Stock Alerts</h2>
    <div class="notification is-warning" th:if="${#lists.isEmpty(lowStock)}">No low stock items.</div>
    <div th:each="p : ${lowStock}" class="box">
        <strong th:text="${p.name}"></strong>
        <span> (Qty: <span th:text="${p.quantityInStock}"></span>)</span>
        <form th:action="@{'/admin/inventory/notify/' + ${p.id}}" method="post" style="display:inline">
            <button class="button is-small is-link" type="submit">Notify Supplier</button>
        </form>
    </div>

    <h2 class="subtitle">All Products</h2>
    <table class="table is-fullwidth is-striped is-hoverable">
        <thead>
        <tr>
            <th>Name</th>
            <th>Qty</th>
            <th>Status</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${products}">
            <td th:text="${p.name}"></td>
            <td th:text="${p.quantityInStock}"></td>
            <td>
                <span th:if="${p.lowStock}" class="tag is-warning">Low</span>
                <span th:unless="${p.lowStock}" class="tag is-success">OK</span>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
