<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(120deg, #e0f2fe, #fae8ff, #fef9c3);
            background-size: 300% 300%;
            animation: bgShift 20s ease infinite;
        }
        @keyframes bgShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .hero.is-soft {
            background: radial-gradient(1000px 500px at 10% 20%, rgba(14,165,233,.15), transparent 60%),
                        radial-gradient(800px 400px at 90% 10%, rgba(168,85,247,.15), transparent 60%);
        }
        .card.image-card {
            overflow: hidden;
            border-radius: 14px;
            box-shadow: 0 8px 28px rgba(2,6,23,.18);
            transition: transform .2s ease, box-shadow .2s ease;
        }
        .card.image-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 40px rgba(2,6,23,.22);
        }
        .card.image-card img {
            height: 180px;
            object-fit: cover;
            width: 100%;
            display: block;
            transition: transform .6s ease;
            opacity: 0;
            animation: imageReveal .9s ease forwards;
        }
        .card.image-card:hover img { transform: scale(1.06); }
        @keyframes imageReveal { from { opacity: 0; transform: scale(1.02); } to { opacity: 1; transform: scale(1); } }
        .button.is-gradient {
            background-image: linear-gradient(135deg, #5b21b6, #0ea5e9);
            color: #fff; border: none;
        }
        /* Dark mode friendly card */
        .glass-card {
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(2,6,23,.15);
            border: 1px solid rgba(255,255,255,0.5);
        }
    </style>
</head>
<body class="section">

<section class="hero is-soft is-medium">
    <div class="hero-body">
        <div class="container">
            <div class="columns is-vcentered">
                <div class="column is-flex is-justify-content-space-between is-align-items-center">
                    <h1 class="title is-2 animate__animated animate__fadeInDown" style="color:#0f172a;">Admin Dashboard</h1>
                    <form method="post" action="/logout">
                        <button class="button is-light" type="submit">Log out</button>
                    </form>
                    <p class="subtitle is-5 animate__animated animate__fadeInUp" style="color:#334155;">Manage products, inventory, and suppliers with a bright, modern UI.</p>
                    <div class="buttons animate__animated animate__fadeInUp">
                        <a class="button is-gradient" th:href="@{/admin/products}">Products</a>
                        <a class="button is-link is-light" th:href="@{/admin/inventory}">Inventory</a>
                        <a class="button is-info is-light" th:href="@{/admin/suppliers}">Suppliers</a>
                        <a class="button is-warning is-light" th:href="@{/reports/admin}">Reports</a>
                    </div>
                </div>
                
            </div>
        </div>
    </div>
</section>

<div class="container">
    <div class="tabs is-toggle is-fullwidth">
        <ul>
            <li class="is-active"><a>Products</a></li>
            <li><a th:href="@{/admin/inventory}">Inventory</a></li>
            <li><a th:href="@{/admin/suppliers}">Suppliers</a></li>
            <li><a th:href="@{/reports/admin}">Reports</a></li>
        </ul>
    </div>

    <!-- Products panel embedded -->
    <div class="glass-card p-5 animate__animated animate__fadeInUp">
        <div th:insert="~{admin/products :: body/*}"></div>
    </div>
</div>
</body>
</html>
