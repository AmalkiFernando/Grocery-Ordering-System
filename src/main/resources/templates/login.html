<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign In</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">
    <style>
        :root {
            --bg-1: #ecfdf5;  /* emerald-50 */
            --bg-2: #d1fae5;  /* emerald-100 */
            --bg-3: #e0f2fe;  /* sky-100 */
            --text-strong: #052e16; /* emerald-950 */
            --text-soft: #1f2937;   /* gray-800 */
            --card-bg: rgba(255,255,255,0.92);
            --accent-1: #059669;    /* emerald-600 */
            --accent-2: #10b981;    /* emerald-500 */
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: linear-gradient(120deg, var(--bg-1), var(--bg-2), var(--bg-3));
            background-size: 300% 300%;
            animation: bgShift 20s ease infinite;
            position: relative;
            overflow: hidden;
        }
        /* Animated grocery background image */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            /* Random high-res grocery/supermarket image from Unsplash */
            background-image: url('https://source.unsplash.com/1920x1080/?grocery,supermarket,produce');
            background-size: cover;
            background-position: center;
            filter: saturate(1.05) contrast(1.02) brightness(1);
            transform: scale(1.05);
            animation: kenBurns 28s ease-in-out infinite alternate;
            z-index: 0; /* above body background */
            opacity: 0.5;
        }
        /* Soft gradient veil above the photo for legibility */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(1200px 800px at 20% 20%, rgba(255,255,255,0.28), transparent 60%),
                        radial-gradient(1200px 800px at 80% 80%, rgba(255,255,255,0.28), transparent 60%);
            z-index: 1; /* above photo */
            pointer-events: none;
        }
        @keyframes bgShift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        @keyframes kenBurns {
            0%   { transform: scale(1.05) translate3d(0px, 0px, 0); }
            100% { transform: scale(1.15) translate3d(2%, -1%, 0); }
        }
        .login-card {
            width: 100%; max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border-radius: 14px;
            box-shadow: 0 12px 40px rgba(2,6,23,.18);
            border: 1px solid rgba(255,255,255,0.55);
            position: relative;
            z-index: 3; /* on top of everything */
        }
        h1.title { color: var(--text-strong); }
        .subtitle { color: var(--text-soft); }
        label.label { color: var(--text-strong); }
        input.input { background: #ffffff; color: var(--text-soft); border-color: #c7f0df; }
        input.input:focus { border-color: var(--accent-2); box-shadow: 0 0 0 0.125em rgba(16,185,129,.25); }
        .button.is-gradient { background-image: linear-gradient(135deg,var(--accent-1),var(--accent-2)); color:#fff; border:none; }
        .button.is-gradient:hover { filter: brightness(1.05); }
        .demo-note { font-size: .9rem; color: var(--text-soft); }
        /* Tabs */
        .login-tabs { display: flex; gap: 6px; background: rgba(255,255,255,0.6); padding: 4px; border-radius: 10px; margin-bottom: 12px; }
        .login-tab { flex: 1; padding: 8px 10px; border-radius: 8px; text-align: center; cursor: pointer; user-select: none; color: var(--text-soft); border: 1px solid transparent; }
        .login-tab.active { color: #fff; background-image: linear-gradient(135deg,var(--accent-1),var(--accent-2)); box-shadow: 0 6px 16px rgba(2,6,23,.18); }
    </style>
    </head>
<body>
    <div class="login-card p-6">
        <div class="login-tabs" role="tablist" aria-label="Choose sign-in role">
            <div class="login-tab active" id="tab-admin" role="tab" aria-selected="true" tabindex="0">Admin</div>
            <div class="login-tab" id="tab-customer" role="tab" aria-selected="false" tabindex="-1">Customer</div>
        </div>
        <h1 class="title is-4 has-text-centered" id="loginTitle">Admin Sign In</h1>
        <p class="subtitle is-6 has-text-centered" id="loginSubtitle">Access to the admin dashboard is restricted.</p>

        <form method="post" action="/login" id="loginForm">
            <div class="field">
                <label class="label">Username</label>
                <div class="control has-icons-left">
                    <input class="input" id="usernameInput" type="text" name="username" placeholder="admin" required />
                    <span class="icon is-small is-left"><i class="fas fa-user"></i></span>
                </div>
            </div>
            <div class="field">
                <label class="label">Password</label>
                <div class="control has-icons-left">
                    <input class="input" id="passwordInput" type="password" name="password" placeholder="admin123" required />
                    <span class="icon is-small is-left"><i class="fas fa-lock"></i></span>
                </div>
            </div>
            <div class="field is-grouped is-grouped-space-between" id="actionsRow">
                <div class="control">
                    <button class="button is-gradient" type="submit">Sign in</button>
                </div>
                <div class="control" id="signupBtn" style="display:none;">
                    <a class="button is-light" href="/signup">Sign up</a>
                </div>
            </div>
            <p class="demo-note">Default admin: <strong>admin</strong> / <strong>admin123</strong></p>
            <p class="demo-note">Customer demo: <strong>customer</strong> / <strong>cust123</strong></p>
        </form>
    </div>

    <!-- Optional icons -->
    <script src="https://kit.fontawesome.com/a2e0e6ad59.js" crossorigin="anonymous"></script>
    <script>
        (function() {
            var tabAdmin = document.getElementById('tab-admin');
            var tabCustomer = document.getElementById('tab-customer');
            var title = document.getElementById('loginTitle');
            var subtitle = document.getElementById('loginSubtitle');
            var user = document.getElementById('usernameInput');
            var pass = document.getElementById('passwordInput');

            function setMode(mode) {
                var isAdmin = mode === 'admin';
                tabAdmin.classList.toggle('active', isAdmin);
                tabCustomer.classList.toggle('active', !isAdmin);
                tabAdmin.setAttribute('aria-selected', String(isAdmin));
                tabCustomer.setAttribute('aria-selected', String(!isAdmin));
                tabAdmin.tabIndex = isAdmin ? 0 : -1;
                tabCustomer.tabIndex = !isAdmin ? 0 : -1;

                var signup = document.getElementById('signupBtn');
                if (isAdmin) {
                    title.textContent = 'Admin Sign In';
                    subtitle.textContent = 'Access to the admin dashboard is restricted.';
                    user.placeholder = 'admin';
                    pass.placeholder = 'admin123';
                    user.value = '';
                    if (signup) signup.style.display = 'none';
                } else {
                    title.textContent = 'Customer Sign In';
                    subtitle.textContent = 'Welcome back! Sign in to continue shopping.';
                    user.placeholder = 'customer';
                    pass.placeholder = 'cust123';
                    user.value = '';
                    if (signup) signup.style.display = '';
                }
                user.focus();
            }

            tabAdmin.addEventListener('click', function(){ setMode('admin'); });
            tabCustomer.addEventListener('click', function(){ setMode('customer'); });
            tabAdmin.addEventListener('keydown', function(e){ if (e.key==='ArrowRight') { setMode('customer'); tabCustomer.focus(); }});
            tabCustomer.addEventListener('keydown', function(e){ if (e.key==='ArrowLeft') { setMode('admin'); tabAdmin.focus(); }});
        })();
    </script>
</body>
</html>
