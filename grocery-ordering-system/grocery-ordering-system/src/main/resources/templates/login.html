<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Grocery Ordering System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .tab-content {
            min-height: 400px;
        }
        .nav-tabs .nav-link {
            border: none;
            color: #6c757d;
            font-weight: 500;
        }
        .nav-tabs .nav-link.active {
            color: #0d6efd;
            border-bottom: 2px solid #0d6efd;
        }
        .form-floating > label {
            color: #6c757d;
        }
        .demo-credentials {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body class="bg-light">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-shopping-cart me-2"></i>Grocery Store
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Home</a>
                <a class="nav-link" href="/products">Products</a>
                <a class="nav-link" href="/register">Sign Up</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="fas fa-sign-in-alt fa-3x text-primary mb-3"></i>
                            <h2>Welcome Back</h2>
                            <p class="text-muted">Sign in to your account</p>
                        </div>
                        
                        <!-- User Type Tabs -->
                        <ul class="nav nav-tabs justify-content-center mb-4" id="loginTypeTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="customer-login-tab" data-bs-toggle="tab" data-bs-target="#customer-login" type="button" role="tab">
                                    <i class="fas fa-user me-2"></i>Customer
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="admin-login-tab" data-bs-toggle="tab" data-bs-target="#admin-login" type="button" role="tab">
                                    <i class="fas fa-user-shield me-2"></i>Admin
                                </button>
                            </li>
                        </ul>

                        <!-- Tab Content -->
                        <div class="tab-content" id="loginTypeTabContent">
                            <!-- Customer Login -->
                            <div class="tab-pane fade show active" id="customer-login" role="tabpanel">
                                <div class="demo-credentials">
                                    <h6><i class="fas fa-info-circle me-2"></i>Demo Credentials</h6>
                                    <small class="text-muted">
                                        Email: <strong>customer@example.com</strong><br>
                                        Password: <strong>password123</strong>
                                    </small>
                                </div>
                                <form id="customerLoginForm" onsubmit="loginUser(event, 'customer')">
                                    <div class="mb-3">
                                        <div class="form-floating">
                                            <input type="email" class="form-control" id="customerEmail" name="email" placeholder="Email" required>
                                            <label for="customerEmail">Email</label>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <div class="form-floating">
                                            <input type="password" class="form-control" id="customerPassword" name="password" placeholder="Password" required>
                                            <label for="customerPassword">Password</label>
                                        </div>
                                    </div>
                                    <div class="mb-3 form-check">
                                        <input type="checkbox" class="form-check-input" id="customerRemember">
                                        <label class="form-check-label" for="customerRemember">Remember me</label>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100 mb-3">
                                        <i class="fas fa-sign-in-alt me-2"></i>Sign In as Customer
                                    </button>
                                </form>
                            </div>

                            <!-- Admin Login -->
                            <div class="tab-pane fade" id="admin-login" role="tabpanel">
                                <div class="demo-credentials">
                                    <h6><i class="fas fa-info-circle me-2"></i>Demo Credentials</h6>
                                    <small class="text-muted">
                                        Email: <strong>admin@example.com</strong><br>
                                        Password: <strong>admin123</strong>
                                    </small>
                                </div>
                                <form id="adminLoginForm" onsubmit="loginUser(event, 'admin')">
                                    <div class="mb-3">
                                        <div class="form-floating">
                                            <input type="email" class="form-control" id="adminEmail" name="email" placeholder="Email" required>
                                            <label for="adminEmail">Email</label>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <div class="form-floating">
                                            <input type="password" class="form-control" id="adminPassword" name="password" placeholder="Password" required>
                                            <label for="adminPassword">Password</label>
                                        </div>
                                    </div>
                                    <div class="mb-3 form-check">
                                        <input type="checkbox" class="form-check-input" id="adminRemember">
                                        <label class="form-check-label" for="adminRemember">Remember me</label>
                                    </div>
                                    <button type="submit" class="btn btn-warning w-100 mb-3">
                                        <i class="fas fa-user-shield me-2"></i>Sign In as Admin
                                    </button>
                                </form>
                            </div>
                        </div>
                        
                        <div class="text-center">
                            <p class="mb-0">Don't have an account? <a href="/register">Sign up</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function loginUser(event, userType) {
            event.preventDefault();
            
            const form = event.target;
            const formData = new FormData(form);
            formData.append('userType', userType);
            
            fetch('/login', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    try {
                        localStorage.setItem('authUser', JSON.stringify(data.user));
                        if (data.token) {
                            localStorage.setItem('authToken', data.token);
                        }
                    } catch (e) {}
                    // Always redirect to products after successful sign in
                    window.location.href = '/products';
                } else {
                    alert('Login failed: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Login failed. Please try again.');
            });
        }
    </script>
</body>
</html>
