<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Grocery Ordering System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .tab-content {
            min-height: 500px;
        }
        .nav-tabs .nav-link {
            border: none;
            color: #6c757d;
            font-weight: 500;
        }
        .nav-tabs .nav-link.active {
            color: #0d6efd;
            border-bottom: 2px solid #0d6efd;
        }
        .form-floating > label {
            color: #6c757d;
        }
    </style>
</head>
<body class="bg-light">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-shopping-cart me-2"></i>Grocery Store
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Home</a>
                <a class="nav-link" href="/products">Products</a>
                <a class="nav-link" href="/login">Sign In</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-8">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="fas fa-user-plus fa-3x text-primary mb-3"></i>
                            <h2>Create Your Account</h2>
                            <p class="text-muted">Join us for the best grocery shopping experience</p>
                        </div>
                        
                        <!-- User Type Tabs -->
                        <ul class="nav nav-tabs justify-content-center mb-4" id="userTypeTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="customer-tab" data-bs-toggle="tab" data-bs-target="#customer" type="button" role="tab">
                                    <i class="fas fa-user me-2"></i>Customer
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="admin-tab" data-bs-toggle="tab" data-bs-target="#admin" type="button" role="tab">
                                    <i class="fas fa-user-shield me-2"></i>Admin
                                </button>
                            </li>
                        </ul>

                        <!-- Tab Content -->
                        <div class="tab-content" id="userTypeTabContent">
                            <!-- Customer Registration -->
                            <div class="tab-pane fade show active" id="customer" role="tabpanel">
                                <form id="customerForm" onsubmit="registerUser(event, 'customer')">
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <div class="form-floating">
                                                <input type="text" class="form-control" id="customerName" name="name" placeholder="Full Name" required>
                                                <label for="customerName">Full Name</label>
                                            </div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <div class="form-floating">
                                                <input type="email" class="form-control" id="customerEmail" name="email" placeholder="Email" required>
                                                <label for="customerEmail">Email</label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <div class="form-floating">
                                                <input type="tel" class="form-control" id="customerPhone" name="phone" placeholder="Phone Number">
                                                <label for="customerPhone">Phone Number</label>
                                            </div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <div class="form-floating">
                                                <input type="password" class="form-control" id="customerPassword" name="password" placeholder="Password" required>
                                                <label for="customerPassword">Password</label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <div class="form-floating">
                                            <textarea class="form-control" id="customerAddress" name="address" placeholder="Address" style="height: 100px"></textarea>
                                            <label for="customerAddress">Delivery Address</label>
                                        </div>
                                    </div>
                                    <div class="mb-3 form-check">
                                        <input type="checkbox" class="form-check-input" id="customerTerms" required>
                                        <label class="form-check-label" for="customerTerms">
                                            I agree to the <a href="#">Terms and Conditions</a>
                                        </label>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100 mb-3">
                                        <i class="fas fa-user-plus me-2"></i>Create Customer Account
                                    </button>
                                </form>
                            </div>

                            <!-- Admin Registration -->
                            <div class="tab-pane fade" id="admin" role="tabpanel">
                                <form id="adminForm" onsubmit="registerUser(event, 'admin')">
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <div class="form-floating">
                                                <input type="text" class="form-control" id="adminName" name="name" placeholder="Full Name" required>
                                                <label for="adminName">Full Name</label>
                                            </div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <div class="form-floating">
                                                <input type="email" class="form-control" id="adminEmail" name="email" placeholder="Email" required>
                                                <label for="adminEmail">Email</label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <div class="form-floating">
                                                <input type="tel" class="form-control" id="adminPhone" name="phone" placeholder="Phone Number">
                                                <label for="adminPhone">Phone Number</label>
                                            </div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <div class="form-floating">
                                                <input type="password" class="form-control" id="adminPassword" name="password" placeholder="Password" required>
                                                <label for="adminPassword">Password</label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <div class="form-floating">
                                            <textarea class="form-control" id="adminAddress" name="address" placeholder="Address" style="height: 100px"></textarea>
                                            <label for="adminAddress">Address</label>
                                        </div>
                                    </div>
                                    <div class="alert alert-warning">
                                        <i class="fas fa-exclamation-triangle me-2"></i>
                                        <strong>Admin Access:</strong> Admin accounts have access to all system management features including user management, product management, and analytics.
                                    </div>
                                    <div class="mb-3 form-check">
                                        <input type="checkbox" class="form-check-input" id="adminTerms" required>
                                        <label class="form-check-label" for="adminTerms">
                                            I agree to the <a href="#">Terms and Conditions</a> and understand admin responsibilities
                                        </label>
                                    </div>
                                    <button type="submit" class="btn btn-warning w-100 mb-3">
                                        <i class="fas fa-user-shield me-2"></i>Create Admin Account
                                    </button>
                                </form>
                            </div>
                        </div>
                        
                        <div class="text-center">
                            <p class="mb-0">Already have an account? <a href="/login">Sign In</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function registerUser(event, userType) {
            event.preventDefault();
            
            const form = event.target;
            const formData = new FormData(form);
            formData.append('userType', userType);
            
            fetch('/register', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    try {
                        localStorage.setItem('authUser', JSON.stringify(data.user));
                        if (data.token) {
                            localStorage.setItem('authToken', data.token);
                        }
                    } catch (e) {}
                    // Always redirect to products after successful sign up
                    window.location.href = '/products';
                } else {
                    alert('Registration failed: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Registration failed. Please try again.');
            });
        }
    </script>
</body>
</html>
