<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Grocery Ordering System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-shopping-cart me-2"></i>Grocery Store
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Home</a>
                <a class="nav-link active auth-only" href="/products" style="display:none;">Products</a>
                <a class="nav-link auth-only" href="/cart" style="display:none;">
                    <i class="fas fa-shopping-cart"></i> Cart
                </a>
                <a class="nav-link auth-only" href="/orders" style="display:none;">Orders</a>
                <a class="nav-link guest-only" href="/login">Login</a>
                <a class="nav-link auth-only" href="#" id="logoutLink" style="display:none;">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-12 d-flex align-items-center mb-3">
                <h1 class="mb-0">Our Products</h1>
                <div class="ms-auto d-flex" style="gap:10px;">
                    <div class="input-group">
                        <input type="text" id="searchInput" class="form-control" placeholder="Search products by name...">
                        <button class="btn btn-outline-secondary" id="searchBtn" type="button">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                    <div>
                        <select id="sortSelect" class="form-select">
                            <option value="featured" selected>Sort: Featured</option>
                            <option value="name-asc">Name A→Z</option>
                            <option value="name-desc">Name Z→A</option>
                            <option value="price-asc">Price Low→High</option>
                            <option value="price-desc">Price High→Low</option>
                            <option value="rating-desc">Rating High→Low</option>
                            <option value="stock-desc">Stock High→Low</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-12">
                <div id="categoryFilters" class="d-flex flex-wrap" style="gap:8px;"></div>
            </div>
        </div>

        <div class="row" id="productsGrid"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function isAuthenticated() {
            try {
                const data = localStorage.getItem('authUser');
                if (!data) return false;
                const parsed = JSON.parse(data);
                return !!parsed && !!parsed.email;
            } catch (e) {
                return false;
            }
        }

        function applyAuthVisibility() {
            const authed = isAuthenticated();
            document.querySelectorAll('.auth-only').forEach(el => {
                el.style.display = authed ? '' : 'none';
            });
            document.querySelectorAll('.guest-only').forEach(el => {
                el.style.display = authed ? 'none' : '';
            });
        }

        function logout() {
            localStorage.removeItem('authUser');
            applyAuthVisibility();
            window.location.href = '/';
        }

        document.addEventListener('DOMContentLoaded', () => {
            applyAuthVisibility();
            const logoutLink = document.getElementById('logoutLink');
            if (logoutLink) {
                logoutLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    logout();
                });
            }
        });

        function authHeaders() {
            const token = localStorage.getItem('authToken');
            return token ? { 'Authorization': 'Bearer ' + token } : {};
        }

        // ------- Demo data, rendering and interactions will be appended here -------
        const categories = [
            { id: 1, name: 'Fruits & Vegetables' },
            { id: 2, name: 'Dairy & Eggs' },
            { id: 3, name: 'Meat & Seafood' },
            { id: 4, name: 'Bakery' },
            { id: 5, name: 'Beverages' }
        ];

        function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        function randFloat(min, max) { return +(Math.random() * (max - min) + min).toFixed(1); }

        const sampleProducts = [
            { id: 101, name: 'Fresh Apples', description: 'Crisp and sweet red apples.', price: 2.99, categoryId: 1, imageUrl: 'https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=600&h=400&fit=crop', stock: rand(15,60), rating: randFloat(3.5,5), reviews: rand(10,120) },
            { id: 102, name: 'Organic Milk', description: 'Fresh organic whole milk.', price: 4.99, categoryId: 2, imageUrl: 'https://images.unsplash.com/photo-1550583724-b2692b85b150?w=600&h=400&fit=crop', stock: rand(10,45), rating: randFloat(3.5,5), reviews: rand(10,120) },
            { id: 103, name: 'Whole Wheat Bread', description: 'Freshly baked whole wheat bread.', price: 3.49, categoryId: 4, imageUrl: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?w=600&h=400&fit=crop', stock: rand(8,30), rating: randFloat(3.5,5), reviews: rand(10,120) },
            { id: 104, name: 'Chicken Breast', description: 'Lean chicken breast, high in protein.', price: 8.99, categoryId: 3, imageUrl: 'https://images.unsplash.com/photo-1604503468506-a8da13d82791?w=600&h=400&fit=crop', stock: rand(5,25), rating: randFloat(3.5,5), reviews: rand(10,120) },
            { id: 105, name: 'Bananas', description: 'Sweet and ripe bananas.', price: 1.99, categoryId: 1, imageUrl: 'https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=600&h=400&fit=crop', stock: rand(20,80), rating: randFloat(3.5,5), reviews: rand(10,120) },
            { id: 106, name: 'Fresh Orange Juice', description: '100% pure orange juice.', price: 5.99, categoryId: 5, imageUrl: 'https://images.unsplash.com/photo-1621506289937-a8e4df240d0b?w=600&h=400&fit=crop', stock: rand(10,35), rating: randFloat(3.5,5), reviews: rand(10,120) },
            { id: 107, name: 'Salmon Fillet', description: 'Fresh Atlantic salmon fillet.', price: 12.99, categoryId: 3, imageUrl: 'https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?w=600&h=400&fit=crop', stock: rand(5,20), rating: randFloat(3.5,5), reviews: rand(10,120) },
            { id: 108, name: 'Greek Yogurt', description: 'Creamy Greek yogurt.', price: 3.99, categoryId: 2, imageUrl: 'https://images.unsplash.com/photo-1571212515410-1a2d4b2b3b3b?w=600&h=400&fit=crop', stock: rand(12,50), rating: randFloat(3.5,5), reviews: rand(10,120) },
            { id: 109, name: 'Carrots', description: 'Crunchy carrots for cooking or snacks.', price: 1.49, categoryId: 1, imageUrl: 'https://images.unsplash.com/photo-1598170845058-32b9d6a5da37?w=600&h=400&fit=crop', stock: rand(25,90), rating: randFloat(3.5,5), reviews: rand(10,120) },
            { id: 110, name: 'Croissants', description: 'Buttery, flaky croissants.', price: 4.49, categoryId: 4, imageUrl: 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=600&h=400&fit=crop', stock: rand(6,24), rating: randFloat(3.5,5), reviews: rand(10,120) },
            { id: 111, name: 'Strawberries', description: 'Sweet and juicy strawberries.', price: 3.99, categoryId: 1, imageUrl: 'https://images.unsplash.com/photo-1464965911861-746a04b4bca6?w=600&h=400&fit=crop', stock: rand(15,55), rating: randFloat(3.5,5), reviews: rand(10,120) },
            { id: 112, name: 'Cheddar Cheese', description: 'Aged cheddar cheese.', price: 6.99, categoryId: 2, imageUrl: 'https://images.unsplash.com/photo-1486297678162-eb2a19b0a32d?w=600&h=400&fit=crop', stock: rand(10,40), rating: randFloat(3.5,5), reviews: rand(10,120) }
        ];

        let activeCategoryId = null;

        function renderCategories() {
            const wrap = document.getElementById('categoryFilters');
            wrap.innerHTML = '';
            const allBtn = document.createElement('button');
            allBtn.className = 'btn btn-sm ' + (activeCategoryId ? 'btn-outline-secondary' : 'btn-primary');
            allBtn.textContent = 'All';
            allBtn.onclick = () => { activeCategoryId = null; filterSortRender(); };
            wrap.appendChild(allBtn);
            categories.forEach(c => {
                const b = document.createElement('button');
                b.className = 'btn btn-sm ' + (activeCategoryId === c.id ? 'btn-primary' : 'btn-outline-secondary');
                b.textContent = c.name;
                b.onclick = () => { activeCategoryId = c.id; filterSortRender(); };
                wrap.appendChild(b);
            });
        }

        function starHtml(rating) {
            const full = Math.floor(rating);
            const half = rating - full >= 0.5;
            let html = '';
            for (let i=0;i<full;i++) html += '<i class="fas fa-star text-warning"></i>';
            if (half) html += '<i class="fas fa-star-half-alt text-warning"></i>';
            for (let i=full + (half?1:0); i<5; i++) html += '<i class="far fa-star text-warning"></i>';
            return html;
        }

        function renderProducts(list) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            if (!list.length) {
                grid.innerHTML = '<div class="col-12"><div class="alert alert-info text-center">No products found</div></div>';
                return;
            }
            list.forEach(p => {
                const col = document.createElement('div');
                col.className = 'col-md-4 mb-4';
                col.innerHTML = `
                    <div class="card h-100">
                        <img src="${p.imageUrl}" class="card-img-top" style="height: 200px; object-fit: cover;" alt="${p.name}">
                        <div class="card-body d-flex flex-column">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h5 class="card-title mb-0">${p.name}</h5>
                                <span class="badge ${p.stock > 15 ? 'bg-success' : 'bg-warning'}">Stock: ${p.stock}</span>
                            </div>
                            <div class="mb-2">${starHtml(p.rating)} <small class="text-muted">${p.rating} (${p.reviews})</small></div>
                            <p class="card-text">${p.description}</p>
                            <div class="mt-auto">
                                <div class="d-flex justify-content-between align-items-center">
                                    <span class="h5 text-success mb-0">$${p.price.toFixed(2)}</span>
                                    <div class="btn-group">
                                        <button class="btn btn-primary" onclick="addToCart(${p.id}, 1)">
                                            <i class="fas fa-plus"></i> Add to Cart
                                        </button>
                                        <a class="btn btn-outline-light" href="/cart" title="Go to Cart">
                                            <i class="fas fa-shopping-cart"></i>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>`;
                grid.appendChild(col);
            });
        }

        function filterSortRender() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            let filtered = sampleProducts.filter(p => !activeCategoryId || p.categoryId === activeCategoryId);
            if (q) filtered = filtered.filter(p => p.name.toLowerCase().includes(q));

            const sort = document.getElementById('sortSelect').value;
            const by = {
                'name-asc': (a,b)=>a.name.localeCompare(b.name),
                'name-desc': (a,b)=>b.name.localeCompare(a.name),
                'price-asc': (a,b)=>a.price-b.price,
                'price-desc': (a,b)=>b.price-a.price,
                'rating-desc': (a,b)=>b.rating-a.rating,
                'stock-desc': (a,b)=>b.stock-a.stock
            }[sort];
            if (by) filtered = [...filtered].sort(by);
            renderProducts(filtered);
            renderCategories();
        }

        document.getElementById('searchBtn').addEventListener('click', filterSortRender);
        document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key==='Enter') filterSortRender(); });
        document.getElementById('sortSelect').addEventListener('change', filterSortRender);

        function addToCart(productId, quantity) {
            fetch('/cart/add', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    ...authHeaders(),
                },
                body: 'productId=' + productId + '&quantity=' + quantity
            })
            .then(response => response.text())
            .then(data => {
                if (data === 'success') {
                    // Show success message
                    const button = event.target.closest('button');
                    const originalText = button.innerHTML;
                    button.innerHTML = '<i class="fas fa-check"></i> Added!';
                    button.classList.remove('btn-primary');
                    button.classList.add('btn-success');
                    
                    setTimeout(() => {
                        button.innerHTML = originalText;
                        button.classList.remove('btn-success');
                        button.classList.add('btn-primary');
                    }, 2000);
                } else {
                    alert('Error adding to cart: ' + data);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error adding to cart');
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            filterSortRender();
        });
    </script>
</body>
</html>
